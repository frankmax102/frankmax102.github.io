<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>魚機分數紀錄</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fb;
      --card: #ffffff;
      --border: #d8deeb;
      --text: #1e2a3a;
      --muted: #5d6b82;
      --primary: #2c7be5;
      --danger: #d64545;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    .container {
      max-width: 1100px;
      margin: 24px auto;
      padding: 0 16px 32px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .desc {
      margin: 0 0 20px;
      color: var(--muted);
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
    }

    .summary-card h2 {
      margin: 0 0 8px;
      font-size: 16px;
      color: var(--muted);
      font-weight: 600;
    }

    .summary-card .value {
      font-size: 30px;
      font-weight: 700;
      color: var(--primary);
    }

    .summary-card .ratio-block {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: grid;
      gap: 10px;
    }

    .summary-card .ratio-block label {
      margin: 0;
    }

    .quotient-label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
    }

    .quotient-value {
      font-size: 26px;
      font-weight: 700;
      color: var(--primary);
    }

    .quotient-sublabel {
      display: block;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      margin: 4px 0 2px;
      line-height: 1.35;
    }

    .global-hole-open {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 14px;
    }

    .global-hole-title {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .global-hole-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .global-hole-body {
      display: grid;
    }

    .global-hole-open .hint {
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
      margin: 0 0 12px;
    }

    .global-batches-list {
      display: grid;
      gap: 8px;
      margin-bottom: 10px;
    }

    .global-batches-list .row {
      grid-template-columns: minmax(0, 1fr) minmax(128px, auto) auto;
    }

    .batch-sync-note {
      align-self: end;
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
      justify-self: end;
    }

    .hole {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .hole-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .hole-title {
      font-size: 20px;
      font-weight: 700;
    }

    .hole-total {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      color: var(--muted);
      font-weight: 600;
    }

    .hole-total strong {
      color: var(--text);
      margin-left: 5px;
    }

    .rows {
      display: grid;
      gap: 8px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr)) minmax(128px, auto) auto;
      gap: 8px;
      align-items: center;
    }

    .row-created-at {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.35;
      align-self: center;
      padding: 2px 0 0;
      word-break: break-word;
    }

    .row-created-at::before {
      content: "新增時間";
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 2px;
    }

    label {
      display: grid;
      gap: 4px;
      font-size: 13px;
      color: var(--muted);
      font-weight: 600;
    }

    input[type="number"] {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      font-size: 16px;
      color: var(--text);
      outline: none;
      background: #fff;
    }

    input[type="number"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(44, 123, 229, 0.15);
    }

    button {
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
    }

    .add-btn {
      background: #e9f2ff;
      color: var(--primary);
    }

    .remove-btn {
      background: #ffeceb;
      color: var(--danger);
      align-self: end;
    }

    .toggle-btn {
      background: #eef2f8;
      color: var(--text);
      padding: 7px 10px;
      font-size: 13px;
    }

    .is-collapsed .global-hole-body,
    .is-collapsed .hole-body {
      display: none;
    }

    @media (max-width: 760px) {
      .summary {
        grid-template-columns: 1fr;
      }

      .row {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>魚機分數紀錄</h1>
    <p class="desc">每個洞都可新增多筆開分與洗分，系統會自動計算各洞總分與全機總分。</p>

    <section class="summary">
      <div class="summary-card">
        <h2>全機總開分</h2>
        <div class="value" id="grandOpen">0</div>
        <div class="ratio-block">
          <div>
            <span class="quotient-label">目前輸贏(不含爆機)</span>
            <span class="quotient-sublabel">全機總洗分 − 全機總開分</span>
            <div class="quotient-value" id="grandWinLossNoBurst">0</div>
          </div>
          <div>
            <span class="quotient-label">目前輸贏(含爆機)</span>
            <span class="quotient-sublabel">目前輸贏(不含爆機) + 全機爆機紅包總分</span>
            <div class="quotient-value" id="grandWinLossWithBurst">0</div>
          </div>
        </div>
      </div>
      <div class="summary-card">
        <h2>全機財神總跳分數</h2>
        <div class="value" id="grandFortune">0</div>
        <h2>全機爆機紅包總分</h2>
        <div class="value" id="grandBurstRed">0</div>
        <div class="ratio-block">
          <label>
            比值
            <input type="number" id="fortuneRatio" class="fortune-ratio-input" step="any" inputmode="decimal" placeholder="請輸入數字" />
          </label>
          <div>
            <span class="quotient-label">財神總跳分數 ÷ 比值</span>
            <div class="quotient-value" id="fortuneQuotient">—</div>
          </div>
        </div>
      </div>
      <div class="summary-card">
        <h2>全機總洗分</h2>
        <div class="value" id="grandWash">0</div>
        <div class="ratio-block">
          <label>
            趴數
            <input type="number" id="openPaiShu" class="open-pai-input" step="any" inputmode="decimal" placeholder="例如 97" />
          </label>
          <div>
            <span class="quotient-label">全機總開分 × 趴數 ÷ 100</span>
            <div class="quotient-value" id="openPaiShuResult">—</div>
          </div>
          <div>
            <span class="quotient-label">全機剩餘分數</span>
            <span class="quotient-sublabel">（趴數÷100）×［全機總開分＋（財神總跳分數÷比值）－全機總洗分］－（財神總跳分數÷比值）</span>
            <div class="quotient-value" id="grandRemaining">—</div>
          </div>
        </div>
      </div>
    </section>

    <section class="global-hole-open" aria-label="全洞開分">
      <div class="global-hole-header">
        <h2 class="global-hole-title">全洞開分</h2>
        <div class="header-actions">
          <button type="button" id="addGlobalBatchBtnHeader" class="add-btn">新增一筆全洞開分</button>
          <button type="button" id="toggleGlobalSectionBtn" class="toggle-btn">收合</button>
        </div>
      </div>
      <div id="globalSectionBody" class="global-hole-body">
        <p class="hint">
          可新增多筆；每一筆開分會同步套用到 1～6 號洞的總開分（財神／洗分可各洞自行填寫）。
        </p>
        <div id="globalBatchesList" class="global-batches-list"></div>
      </div>
    </section>

    <div id="holes"></div>
  </div>

  <script>
    const holeCount = 6;
    const STORAGE_KEY = "fishrecord.v1";
    const holesContainer = document.getElementById("holes");
    const grandOpenEl = document.getElementById("grandOpen");
    const grandWinLossNoBurstEl = document.getElementById("grandWinLossNoBurst");
    const grandWinLossWithBurstEl = document.getElementById("grandWinLossWithBurst");
    const grandFortuneEl = document.getElementById("grandFortune");
    const grandWashEl = document.getElementById("grandWash");
    const grandBurstRedEl = document.getElementById("grandBurstRed");
    const fortuneRatioInput = document.getElementById("fortuneRatio");
    const fortuneQuotientEl = document.getElementById("fortuneQuotient");
    const openPaiShuInput = document.getElementById("openPaiShu");
    const openPaiShuResultEl = document.getElementById("openPaiShuResult");
    const grandRemainingEl = document.getElementById("grandRemaining");
    const globalBatchesList = document.getElementById("globalBatchesList");
    const addGlobalBatchBtnHeader = document.getElementById("addGlobalBatchBtnHeader");
    const globalSectionEl = document.querySelector(".global-hole-open");
    const globalSectionBody = document.getElementById("globalSectionBody");
    const toggleGlobalSectionBtn = document.getElementById("toggleGlobalSectionBtn");

    let globalBatches = [];

    function toNumber(value) {
      const num = Number(value);
      return Number.isFinite(num) ? num : 0;
    }

    function formatQuotient(value) {
      if (!Number.isFinite(value)) {
        return "—";
      }
      if (Number.isInteger(value)) {
        return String(value);
      }
      const text = value.toFixed(6).replace(/\.?0+$/, "");
      return text || "—";
    }

    function nowIso() {
      return new Date().toISOString();
    }

    function formatRowCreatedAt(iso) {
      if (!iso || typeof iso !== "string") {
        return "—";
      }
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) {
        return "—";
      }
      return d.toLocaleString("zh-TW", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false,
      });
    }

    function getCurrentData() {
      return Array.from(document.querySelectorAll(".hole")).map((holeEl) => {
        const rows = Array.from(holeEl.querySelectorAll(".row")).map((rowEl) => {
          return {
            open: toNumber(rowEl.querySelector(".open-input").value),
            fortune: toNumber(rowEl.querySelector(".fortune-input").value),
            wash: toNumber(rowEl.querySelector(".wash-input").value),
            burstRed: toNumber(rowEl.querySelector(".burst-red-input").value),
            createdAt: rowEl.dataset.createdAt || null,
          };
        });
        return { rows };
      });
    }

    function saveData() {
      const ratioRaw = fortuneRatioInput?.value?.trim() ?? "";
      const fortuneRatio = ratioRaw === "" ? null : toNumber(ratioRaw);
      const paiRaw = openPaiShuInput?.value?.trim() ?? "";
      const openPaiShu = paiRaw === "" ? null : toNumber(paiRaw);
      const payload = {
        version: 1,
        holes: getCurrentData(),
        fortuneRatio,
        openPaiShu,
        globalBatches: globalBatches.map((b) => ({
          id: b.id,
          open: toNumber(b.open),
          createdAt: typeof b.createdAt === "string" ? b.createdAt : null,
        })),
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    }

    function normalizeGlobalBatches(parsed) {
      if (Array.isArray(parsed.globalBatches) && parsed.globalBatches.length > 0) {
        return parsed.globalBatches
          .filter((b) => b && b.id != null)
          .map((b) => ({
            id: String(b.id),
            open: toNumber(b.open),
            createdAt: typeof b.createdAt === "string" ? b.createdAt : null,
          }));
      }
      const legacy =
        parsed.globalHoleOpen === undefined || parsed.globalHoleOpen === null
          ? NaN
          : Number(parsed.globalHoleOpen);
      if (Number.isFinite(legacy) && legacy !== 0) {
        return [{ id: `legacy-${Date.now()}`, open: legacy, createdAt: null }];
      }
      return [];
    }

    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.holes)) return null;
        return {
          holes: parsed.holes,
          fortuneRatio:
            parsed.fortuneRatio === undefined || parsed.fortuneRatio === null
              ? null
              : Number(parsed.fortuneRatio),
          openPaiShu:
            parsed.openPaiShu === undefined || parsed.openPaiShu === null
              ? null
              : Number(parsed.openPaiShu),
          globalBatches: normalizeGlobalBatches(parsed),
        };
      } catch (error) {
        return null;
      }
    }

    function createInput(labelText, className) {
      const label = document.createElement("label");
      label.textContent = labelText;

      const input = document.createElement("input");
      input.type = "number";
      input.step = "1";
      input.value = "0";
      input.className = className;
      input.addEventListener("input", () => {
        updateAllTotals();
      });

      label.appendChild(input);
      return label;
    }

    fortuneRatioInput.addEventListener("input", () => {
      updateAllTotals();
    });

    openPaiShuInput.addEventListener("input", () => {
      updateAllTotals();
    });

    addGlobalBatchBtnHeader.addEventListener("click", () => {
      if (globalSectionEl.classList.contains("is-collapsed")) {
        setCollapsed(globalSectionEl, toggleGlobalSectionBtn, false);
      }
      addGlobalBatch();
    });

    function setCollapsed(sectionEl, buttonEl, collapsed) {
      sectionEl.classList.toggle("is-collapsed", collapsed);
      buttonEl.textContent = collapsed ? "展開" : "收合";
    }

    toggleGlobalSectionBtn.addEventListener("click", () => {
      const collapsed = !globalSectionEl.classList.contains("is-collapsed");
      setCollapsed(globalSectionEl, toggleGlobalSectionBtn, collapsed);
    });

    function newBatchId() {
      return globalThis.crypto?.randomUUID?.() ?? `b-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    }

    function setBatchOpen(batchId, value, skipElement) {
      const batch = globalBatches.find((b) => b.id === batchId);
      if (batch) {
        batch.open = value;
      }
      const display = String(toNumber(value));
      document
        .querySelectorAll(`.global-batch-editor[data-batch-id="${batchId}"] .open-input`)
        .forEach((el) => {
          if (el !== skipElement) {
            el.value = display;
          }
        });
    }

    function renderGlobalBatchList() {
      if (!globalBatchesList) {
        return;
      }
      globalBatchesList.innerHTML = "";
      globalBatches.forEach((batch) => {
        const row = document.createElement("div");
        row.className = "row global-batch-editor";
        row.dataset.batchId = batch.id;

        const openLabel = document.createElement("label");
        openLabel.textContent = "開分（同步至 1～6 號洞）";
        const openField = document.createElement("input");
        openField.type = "number";
        openField.step = "1";
        openField.className = "open-input";
        openField.value = String(toNumber(batch.open));
        openField.addEventListener("input", (e) => {
          setBatchOpen(batch.id, toNumber(e.target.value), e.target);
          updateAllTotals();
        });
        openLabel.appendChild(openField);

        const timeEl = document.createElement("div");
        timeEl.className = "row-created-at";
        timeEl.textContent = formatRowCreatedAt(batch.createdAt);

        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.className = "remove-btn";
        removeButton.textContent = "刪除本筆";
        removeButton.addEventListener("click", () => {
          removeBatch(batch.id);
        });

        row.appendChild(openLabel);
        row.appendChild(timeEl);
        row.appendChild(removeButton);
        globalBatchesList.appendChild(row);
      });
    }

    function removeBatch(batchId) {
      globalBatches = globalBatches.filter((b) => b.id !== batchId);
      renderGlobalBatchList();
      updateAllTotals();
    }

    function addGlobalBatch() {
      const batch = { id: newBatchId(), open: 0, createdAt: nowIso() };
      globalBatches.push(batch);
      renderGlobalBatchList();
      updateAllTotals();
      const newInput = globalBatchesList?.querySelector(
        `.global-batch-editor[data-batch-id="${batch.id}"] .open-input`,
      );
      if (newInput) {
        newInput.focus();
        newInput.select();
      }
    }

    function addRow(rowsContainer, rowData) {
      const base = rowData ?? { open: 0, fortune: 0, wash: 0, burstRed: 0 };
      const row = document.createElement("div");
      row.className = "row";
      let createdAtIso = null;
      if (typeof base.createdAt === "string" && base.createdAt.length > 0) {
        createdAtIso = base.createdAt;
      } else if (rowData === undefined) {
        createdAtIso = nowIso();
      }
      if (createdAtIso) {
        row.dataset.createdAt = createdAtIso;
      }

      const openInput = createInput("開分", "open-input");
      const fortuneInput = createInput("財神跳分數", "fortune-input");
      const washInput = createInput("洗分", "wash-input");
      const burstInput = createInput("爆機紅包", "burst-red-input");
      openInput.querySelector(".open-input").value = String(toNumber(base.open));
      fortuneInput.querySelector(".fortune-input").value = String(toNumber(base.fortune));
      washInput.querySelector(".wash-input").value = String(toNumber(base.wash));
      burstInput.querySelector(".burst-red-input").value = String(toNumber(base.burstRed));

      const timeEl = document.createElement("div");
      timeEl.className = "row-created-at";
      timeEl.textContent = formatRowCreatedAt(createdAtIso);

      const removeButton = document.createElement("button");
      removeButton.type = "button";
      removeButton.className = "remove-btn";
      removeButton.textContent = "刪除本筆";
      removeButton.addEventListener("click", () => {
        row.remove();
        updateAllTotals();
      });

      row.appendChild(openInput);
      row.appendChild(fortuneInput);
      row.appendChild(washInput);
      row.appendChild(burstInput);
      row.appendChild(timeEl);
      row.appendChild(removeButton);
      rowsContainer.appendChild(row);
    }

    function createHole(holeNumber) {
      const section = document.createElement("section");
      section.className = "hole";
      section.dataset.hole = String(holeNumber);

      const header = document.createElement("div");
      header.className = "hole-header";

      const title = document.createElement("div");
      title.className = "hole-title";
      title.textContent = `${holeNumber}號洞`;

      const totals = document.createElement("div");
      totals.className = "hole-total";
      totals.innerHTML = `
        <span>總開分<strong class="open-total">0</strong></span>
        <span>財神總跳分數<strong class="fortune-total">0</strong></span>
        <span>爆機紅包總分<strong class="burst-red-total">0</strong></span>
        <span>總洗分<strong class="wash-total">0</strong></span>
      `;

      header.appendChild(title);
      header.appendChild(totals);

      const toggleButton = document.createElement("button");
      toggleButton.type = "button";
      toggleButton.className = "toggle-btn";
      toggleButton.textContent = "收合";
      toggleButton.addEventListener("click", () => {
        const collapsed = !section.classList.contains("is-collapsed");
        setCollapsed(section, toggleButton, collapsed);
      });

      const addButtonHeader = document.createElement("button");
      addButtonHeader.type = "button";
      addButtonHeader.className = "add-btn";
      addButtonHeader.textContent = "新增一筆";
      addButtonHeader.addEventListener("click", () => {
        if (section.classList.contains("is-collapsed")) {
          setCollapsed(section, toggleButton, false);
        }
        addRow(rowsContainer);
        updateAllTotals();
        const lastRow = rowsContainer.lastElementChild;
        const firstInput = lastRow?.querySelector(".open-input");
        if (firstInput) {
          firstInput.focus();
          firstInput.select();
        }
      });

      const headerActions = document.createElement("div");
      headerActions.className = "header-actions";
      headerActions.appendChild(addButtonHeader);
      headerActions.appendChild(toggleButton);
      header.appendChild(headerActions);

      const rowsContainer = document.createElement("div");
      rowsContainer.className = "rows";

      const body = document.createElement("div");
      body.className = "hole-body";
      body.appendChild(rowsContainer);

      section.appendChild(header);
      section.appendChild(body);
      holesContainer.appendChild(section);
    }

    function renderHoleRows(rowsContainer, holeData) {
      rowsContainer.innerHTML = "";
      const savedRows = Array.isArray(holeData?.rows) ? holeData.rows : [];
      if (savedRows.length > 0) {
        savedRows.forEach((row) => addRow(rowsContainer, row));
      }
    }

    function createHoleWithData(holeNumber, holeData) {
      createHole(holeNumber);
      const holeEl = holesContainer.lastElementChild;
      const rowsContainer = holeEl.querySelector(".rows");
      renderHoleRows(rowsContainer, holeData);
    }

    function updateAllTotals() {
      let grandOpen = 0;
      let grandFortune = 0;
      let grandBurstRed = 0;
      let grandWash = 0;

      document.querySelectorAll(".hole").forEach((holeEl) => {
        let holeOpen = 0;
        let holeFortune = 0;
        let holeBurstRed = 0;
        let holeWash = 0;

        globalBatches.forEach((batch) => {
          holeOpen += toNumber(batch.open);
        });

        holeEl.querySelectorAll(".open-input").forEach((input) => {
          holeOpen += toNumber(input.value);
        });
        holeEl.querySelectorAll(".wash-input").forEach((input) => {
          holeWash += toNumber(input.value);
        });
        holeEl.querySelectorAll(".fortune-input").forEach((input) => {
          holeFortune += toNumber(input.value);
        });
        holeEl.querySelectorAll(".burst-red-input").forEach((input) => {
          holeBurstRed += toNumber(input.value);
        });

        holeEl.querySelector(".open-total").textContent = String(holeOpen);
        holeEl.querySelector(".fortune-total").textContent = String(holeFortune);
        holeEl.querySelector(".burst-red-total").textContent = String(holeBurstRed);
        holeEl.querySelector(".wash-total").textContent = String(holeWash);

        grandOpen += holeOpen;
        grandFortune += holeFortune;
        grandBurstRed += holeBurstRed;
        grandWash += holeWash;
      });

      grandOpenEl.textContent = String(grandOpen);
      grandFortuneEl.textContent = String(grandFortune);
      grandBurstRedEl.textContent = String(grandBurstRed);
      grandWashEl.textContent = String(grandWash);

      const winLossNoBurst = grandWash - grandOpen;
      const winLossWithBurst = winLossNoBurst + grandBurstRed;
      grandWinLossNoBurstEl.textContent = formatQuotient(winLossNoBurst);
      grandWinLossWithBurstEl.textContent = formatQuotient(winLossWithBurst);

      const ratioRaw = fortuneRatioInput?.value?.trim() ?? "";
      let fortuneQuotientNum = null;
      if (ratioRaw === "") {
        fortuneQuotientEl.textContent = "—";
      } else {
        const ratio = toNumber(ratioRaw);
        if (ratio === 0) {
          fortuneQuotientEl.textContent = "—";
        } else {
          fortuneQuotientNum = grandFortune / ratio;
          fortuneQuotientEl.textContent = formatQuotient(fortuneQuotientNum);
        }
      }

      const paiRaw = openPaiShuInput?.value?.trim() ?? "";
      let openPaiNum = null;
      if (paiRaw === "") {
        openPaiShuResultEl.textContent = "—";
      } else {
        const pai = toNumber(paiRaw);
        openPaiNum = (grandOpen * pai) / 100;
        openPaiShuResultEl.textContent = formatQuotient(openPaiNum);
      }

      if (
        openPaiNum === null ||
        fortuneQuotientNum === null ||
        !Number.isFinite(openPaiNum) ||
        !Number.isFinite(fortuneQuotientNum)
      ) {
        grandRemainingEl.textContent = "—";
      } else {
        const pai = toNumber(paiRaw);
        const remaining =
          (pai / 100) * (grandOpen + fortuneQuotientNum - grandWash) - fortuneQuotientNum;
        grandRemainingEl.textContent = formatQuotient(remaining);
      }

      saveData();
    }

    const saved = loadData();
    globalBatches = saved?.globalBatches ?? [];
    const savedHoles = saved?.holes ?? null;
    for (let i = 1; i <= holeCount; i += 1) {
      createHoleWithData(i, savedHoles?.[i - 1]);
    }
    renderGlobalBatchList();
    if (saved?.fortuneRatio != null && Number.isFinite(saved.fortuneRatio)) {
      fortuneRatioInput.value = String(saved.fortuneRatio);
    }
    if (saved?.openPaiShu != null && Number.isFinite(saved.openPaiShu)) {
      openPaiShuInput.value = String(saved.openPaiShu);
    }
    updateAllTotals();
  </script>
</body>
</html>
